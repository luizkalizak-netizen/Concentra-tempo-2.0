<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concentra-Tempo 2.0</title>
    <style>
        /* Estilo Moderno e Minimalista */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        .modes {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .mode-btn {
            background: none;
            border: 1px solid var(--text-secondary);
            color: var(--text-secondary);
            padding: 5px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .mode-btn.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: var(--bg-color);
            font-weight: bold;
        }

        #timer {
            font-size: 5rem;
            font-weight: bold;
            margin: 1rem 0;
            font-variant-numeric: tabular-nums;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 1rem;
        }

        .main-btn {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .main-btn:active {
            transform: scale(0.95);
        }

        .secondary-btn {
            background: none;
            border: 1px solid var(--text-secondary);
            color: var(--text-secondary);
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>CONCENTRA-TEMPO 2.0</h1>
        
        <div class="modes">
            <button class="mode-btn active" onclick="setMode('foco')">Foco</button>
            <button class="mode-btn" onclick="setMode('curto')">Pausa Curta</button>
            <button class="mode-btn" onclick="setMode('longo')">Pausa Longa</button>
        </div>

        <div id="timer">25:00</div>

        <div class="controls">
            <button class="main-btn" id="startBtn" onclick="toggleTimer()">INICIAR</button>
            <button class="secondary-btn" onclick="resetTimer()">Reiniciar</button>
        </div>

        <div class="footer">Foco no desenvolvimento • K-Tech</div>
    </div>

    <script>
        let timeLeft = 25 * 60;
        let timerId = null;
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('startBtn');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.title = `${timerDisplay.textContent} - Concentra-Tempo`;
        }

        function toggleTimer() {
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
                startBtn.textContent = 'INICIAR';
                startBtn.style.backgroundColor = '#38bdf8';
            } else {
                startBtn.textContent = 'PAUSAR';
                startBtn.style.backgroundColor = '#fb7185'; // Cor avermelhada ao pausar
                timerId = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        alert("Tempo esgotado!");
                        resetTimer();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerId);
            timerId = null;
            startBtn.textContent = 'INICIAR';
            startBtn.style.backgroundColor = '#38bdf8';
            setMode('foco'); 
        }

        function setMode(mode) {
            clearInterval(timerId);
            timerId = null;
            startBtn.textContent = 'INICIAR';
            
            // Remove classe active de todos
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            
            if (mode === 'foco') {
                timeLeft = 25 * 60;
                document.querySelector('button[onclick="setMode(\'foco\')"]').classList.add('active');
            } else if (mode === 'curto') {
                timeLeft = 5 * 60;
                document.querySelector('button[onclick="setMode(\'curto\')"]').classList.add('active');
            } else if (mode === 'longo') {
                timeLeft = 15 * 60;
                document.querySelector('button[onclick="setMode(\'longo\')"]').classList.add('active');
            }
            updateDisplay();
        }
    </script>
</body>
</html>
